name: Radar Okazji — aktualizacja ogłoszeń
on:
  push:
    paths:
      - 'scripts/refresh.py'
      - '.github/workflows/refresh.yml'
      - 'app.py'
      - 'static/index.html'
      - 'static/manifest.webmanifest'
      - 'tests/test_scraper.py'
  workflow_dispatch:
  schedule:
    - cron: '23 5,11,17,23 * * *'
permissions:
  contents: write
concurrency:
  group: radar-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.3 beautifulsoup4==4.12.3
      - name: Verify scraper and application code
        run: |
          python -m py_compile app.py scripts/refresh.py
          python -m unittest discover -s tests -v
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("static/index.html").read_text(encoding="utf-8")
          matches = re.findall(r"<script[^>]*>(.*?)</script>", html, re.S)
          if not matches:
              raise SystemExit("Browser script missing")
          Path("/tmp/radar-browser.js").write_text("\n".join(matches), encoding="utf-8")
          PY
          node --check /tmp/radar-browser.js
      - name: Scan public listings
        run: python scripts/refresh.py
      - name: Commit fresh results
        run: |
          git config user.name "radar-okazji-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/verified.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public property leads [skip ci]"
            if ! git push; then
              echo "Repository changed during scan; re-running against newest data"
              git fetch origin main
              git reset --hard origin/main
              python scripts/refresh.py
              git add data/verified.json
              if ! git diff --cached --quiet; then
                git commit -m "Update public property leads after sync [skip ci]"
                git push
              fi
            fi
          fi
