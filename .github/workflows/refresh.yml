name: Radar Okazji — aktualizacja ogłoszeń
on:
  workflow_dispatch:
  schedule:
    - cron: '23 5,11,17,23 * * *'
permissions:
  contents: write
concurrency:
  group: radar-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.3
      - run: python scripts/refresh.py
      - name: Commit fresh results
        run: |
          git config user.name "radar-okazji-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/verified.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public property leads [skip ci]"
            git push
          fi
